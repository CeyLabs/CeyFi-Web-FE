<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CeyPay: Sell, Send &amp; Buy</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* CeyPay design tokens: from ceypay.io (Geist, #1C6EF5, glass cards r24, buttons r8) */
:root{
  --blue:#1C6EF5; --blue-2:#3d86ff; --blue-soft:rgba(28,110,245,.14);
  --bg:#000; --bg-2:#0a0a0a; --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.035); --line:rgba(255,255,255,.15); --line-2:rgba(255,255,255,.1);
  --ink:#fff; --text:#d4d4d8; --muted:#a1a1aa; --field:rgba(255,255,255,.06);
  --ok:#34d399; --okS:rgba(52,211,153,.12); --err:#f87171; --errS:rgba(248,113,113,.12); --warn:#fbbf24; --warnS:rgba(251,191,36,.12);
  --h-grad:linear-gradient(#fff,#fff,rgba(255,255,255,.6)); --h2-grad:linear-gradient(to right,#fff 0%,rgba(255,255,255,.3) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.35),transparent 70%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#fff; --bg-2:#f6f7f9; --glass:#f7f8fa; --glass-2:#fafbfc; --line:#e4e4e7; --line-2:#ececef; --ink:#09090b; --text:#3f3f46; --muted:#71717a; --field:#fff;
  --ok:#059669; --okS:#ecfdf5; --err:#dc2626; --errS:#fef2f2; --warn:#b45309; --warnS:#fffbeb;
  --h-grad:linear-gradient(#09090b,#09090b,rgba(9,9,11,.65)); --h2-grad:linear-gradient(to right,#09090b 0%,rgba(9,9,11,.45) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.16),transparent 70%);
}}
:root[data-theme="light"]{
  --bg:#fff; --bg-2:#f6f7f9; --glass:#f7f8fa; --glass-2:#fafbfc; --line:#e4e4e7; --line-2:#ececef; --ink:#09090b; --text:#3f3f46; --muted:#71717a; --field:#fff;
  --ok:#059669; --okS:#ecfdf5; --err:#dc2626; --errS:#fef2f2; --warn:#b45309; --warnS:#fffbeb;
  --h-grad:linear-gradient(#09090b,#09090b,rgba(9,9,11,.65)); --h2-grad:linear-gradient(to right,#09090b 0%,rgba(9,9,11,.45) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.16),transparent 70%);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.sandbar{font-family:'Geist Mono',monospace;font-size:11.5px;text-align:center;padding:6px 16px;background:var(--warnS);color:var(--warn);letter-spacing:.3px}

/* nav: floating glass bar */
.navw{position:sticky;top:10px;z-index:30;padding:0 12px}
nav{max-width:1120px;margin:10px auto 0;display:flex;align-items:center;gap:22px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;color:var(--ink)} .logo img,.logo svg{height:26px;width:auto;display:block}
.links{display:flex;gap:22px;font-size:14px;color:var(--text)} .links a:hover{color:var(--ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-2)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)} .btn.ghost:hover{background:var(--line-2)}
.btn.lg{height:52px;font-size:16px;border-radius:12px;width:100%}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
#userBtn{display:flex;align-items:center}
@media (max-width:860px){.links{display:none}}
@media (max-width:520px){.big{font-size:19px;padding-right:128px}.det{max-width:118px}.chips{grid-template-columns:repeat(3,1fr)}}

/* hero */
.hero{position:relative;padding:64px 0 40px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px;color:var(--text)}
.pill b{background:var(--blue);color:#fff;border-radius:99px;padding:2px 9px;font-weight:500;font-size:11.5px}
h1{font-weight:500;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-1.8px;margin:18px 0 12px;color:var(--ink)}
h1 span{display:block;background:var(--h-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span+span{opacity:.75}
.lead{max-width:560px;margin:0 auto;color:var(--muted);font-size:16.5px;line-height:1.55}

/* composer */
.composer{position:relative;max-width:640px;margin:28px auto 0;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(8px)}
.recents{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.recents::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass-2);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.rc:hover{border-color:var(--blue)} .rc i{font-style:normal;color:var(--muted)}
.inrow{position:relative}
.big{width:100%;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:22px;letter-spacing:.5px;padding:0 150px 0 18px;font-family:'Geist Mono',monospace}
.big::placeholder{font-family:Geist,sans-serif;letter-spacing:0;font-size:17px;color:var(--muted)}
.big:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.det{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;max-width:140px}
.det span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det .dotc{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.det.none{color:var(--muted)} .det.none .dotc{background:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;min-height:18px}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:14px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.chip{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2);font-weight:500;cursor:pointer;font-family:'Geist Mono',monospace;font-size:14px}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
.amtrow{display:flex;gap:10px;align-items:center;margin-top:12px}
.amt{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-family:'Geist Mono',monospace;font-size:18px;padding:0 14px 0 56px}
.amt:focus{outline:none;border-color:var(--blue)}
.amtw{position:relative;flex:1} .amtw::before{content:"LKR";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-family:'Geist Mono',monospace}
.duebox{margin-top:14px;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--glass-2);display:flex;justify-content:space-between;gap:12px;align-items:center}
.duebox small{color:var(--muted);display:block} .duebox b{color:var(--ink);font-weight:500}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.2s infinite;width:140px}
@keyframes sk{to{background-position:-200% 0}}
.payrow{margin-top:16px}
.payvia{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.payvia a{color:var(--blue);cursor:pointer}
.err{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:13.5px;background:var(--errS);color:var(--err)}

/* sections */
section.s{padding:72px 0}
h2{font-weight:400;font-size:clamp(26px,3.6vw,36px);letter-spacing:-1.8px;margin:0 0 8px;background:var(--h2-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.sub{color:var(--muted);margin:0 0 28px;font-size:16px;max-width:620px;line-height:1.5}
.grid{display:grid;gap:12px}
.cats{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px}
.card.c2{background:var(--glass-2);border-color:var(--line-2)}
.cat{cursor:pointer;text-align:left;transition:border-color .15s} .cat:hover{border-color:var(--blue)}
.cat svg{width:26px;height:26px;color:var(--blue);margin-bottom:14px}
.cat b{display:block;color:var(--ink);font-weight:500} .cat small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
.bento{grid-template-columns:repeat(3,1fr)} @media (max-width:820px){.bento{grid-template-columns:1fr}}
.bento .card b{display:block;color:var(--ink);font-weight:500;font-size:17px;margin-bottom:6px}
.bento .card p{margin:0;color:var(--muted);line-height:1.55}
.span2{grid-column:span 2} @media (max-width:820px){.span2{grid-column:auto}}
.xrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.xb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;color:var(--ink);background:var(--glass-2)}
.xl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#000;flex:none}
.xl.binance{background:#F0B90B}.xl.bybit{background:#F7A600}.xl.kucoin{background:#23AF91}
.steps3{grid-template-columns:repeat(3,1fr)} @media (max-width:760px){.steps3{grid-template-columns:1fr}}
.n{font-family:'Geist Mono',monospace;color:var(--blue);font-size:13px;margin-bottom:10px}
.faq details{border-bottom:1px solid var(--line-2);padding:16px 0}
.faq summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:16px;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"+";color:var(--muted)} .faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);line-height:1.6;margin:10px 0 0}
footer{border-top:1px solid var(--line-2);padding:40px 0 30px;font-size:13.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px} @media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
footer h4{color:var(--ink);font-weight:500;margin:0 0 10px;font-size:14px} footer a{display:block;margin:7px 0} footer a:hover{color:var(--ink)}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 14px}
.ov.on{display:flex}
.sheet{width:100%;max-width:480px;background:var(--bg-2);border:1px solid var(--line);border-radius:24px;padding:22px;position:relative;color:var(--text)}
@media (max-width:520px){.ov{padding:0;align-items:flex-end}.sheet{border-radius:24px 24px 0 0;max-height:92vh;overflow:auto}}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.sh{color:var(--ink);font-size:19px;font-weight:500;margin:0 40px 4px 0;letter-spacing:-.4px}
.shs{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.f{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:15px;padding:0 12px}
.f:focus{outline:none;border-color:var(--blue)}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--glass-2);cursor:pointer;margin-top:8px;width:100%;text-align:left}
.opt:hover{border-color:var(--blue)} .opt.on{border-color:var(--blue);background:var(--blue-soft)} .opt.dis{opacity:.5;cursor:not-allowed}
.opt b{display:block;color:var(--ink);font-weight:500} .opt small{color:var(--muted)} .opt .r{margin-left:auto;text-align:right;font-size:13px;white-space:nowrap}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:12px;flex:none}
.grp{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 0 2px;font-family:'Geist Mono',monospace}
.sum{border:1px solid var(--line-2);border-radius:14px;padding:10px 14px;margin-top:12px;background:var(--glass-2)}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px} .sum b{color:var(--ink);font-weight:500;text-align:right}
.sum .tot{border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px;font-size:16px}
.stat{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;font-family:'Geist Mono',monospace}
.st-active{background:var(--okS);color:var(--ok)} .st-pending_authorization{background:var(--warnS);color:var(--warn)} .st-rejected_duplicate,.st-expired{background:var(--errS);color:var(--err)}
.bar{height:5px;border-radius:5px;background:var(--line-2);margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--blue)}
.acc{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--glass-2);margin-top:10px}
.acc .top{display:flex;align-items:center;gap:10px} .acc .top b{color:var(--ink);font-weight:500}
.acc .meta{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.acc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xpick{border:1px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--glass-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.xpick.on{border-color:var(--blue);background:var(--blue-soft)} .xpick .xl{width:30px;height:30px;font-size:13px;border-radius:8px}
.prog{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.pst{display:flex;gap:10px;align-items:center;color:var(--ink)}
.dt{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none}
.dt.done{background:var(--ok);border-color:var(--ok);color:#000} .dt.run{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite} .dt.fail{background:var(--err);border-color:var(--err);color:#000}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{width:64px;height:64px;border-radius:50%;background:var(--okS);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:8px auto}
.amtbig{text-align:center;font-size:36px;color:var(--ink);font-weight:500;letter-spacing:-1px;font-family:'Geist Mono',monospace}
.qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:12px auto}
.search{position:relative;margin-bottom:6px}
.list{max-height:56vh;overflow:auto}

/* ================= app shell ================= */
nav.tnav,nav.bnav{max-width:none;margin:0;padding:0;border:0;border-radius:0;background:none;backdrop-filter:none}
.gate{display:flex;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13.5px}
.gate b{color:var(--ink);font-weight:500}
body{min-height:100vh}
.hdr{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2)}
.hdr .in{max-width:1080px;margin:0 auto;height:60px;display:flex;align-items:center;gap:18px;padding:0 20px}
.hdr .lg svg{height:24px;width:auto;display:block;color:var(--ink)}
.demo{font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.5px;padding:3px 8px;border-radius:99px;background:var(--warnS);color:var(--warn)}
.tnav{display:flex;gap:4px;margin-left:10px}
.tnav a{padding:8px 12px;border-radius:9px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tnav a:hover{color:var(--ink);background:var(--glass)}
.tnav a[aria-current="page"]{color:var(--ink);background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)}
.me{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:0;cursor:pointer}
nav.bnav{display:none}
@media (max-width:820px){
  .tnav{display:none}
  nav.bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line-2);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 0}
  .bnav a svg{width:22px;height:22px}
  .bnav a[aria-current="page"]{color:var(--blue)}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important}
}
main{max-width:1080px;margin:0 auto;padding:20px 20px 60px;position:relative}
main::before{content:"";position:fixed;inset:0;background:var(--glow);pointer-events:none;z-index:-1}
.view{animation:vin .18s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.col{max-width:540px;margin:0 auto}
.vh{display:flex;align-items:center;gap:10px;margin:4px 0 16px}
.vh h1{font-size:24px;letter-spacing:-.6px;margin:0;line-height:1.2;font-weight:500;color:var(--ink)}
.vh h1 span{display:inline;background:none;color:inherit}
.vh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.back{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer;flex:none;font-size:16px}
.soon{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:var(--warnS);color:var(--warn)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px}
.panel+.panel{margin-top:12px}
.ptitle{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-family:'Geist Mono',monospace;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
.ptitle a{color:var(--blue);text-transform:none;letter-spacing:0;font-family:Geist,sans-serif;font-size:13px;cursor:pointer}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg a{text-align:center;border-radius:9px;padding:8px;font-size:14px;font-weight:500;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:6px}
.seg a[aria-current="page"]{background:var(--blue);color:#fff}
.seg a[aria-current="page"] .soon{background:rgba(255,255,255,.2);color:#fff}

/* ================= home ================= */
.hgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px} @media (max-width:820px){.hgrid{grid-template-columns:1fr}}
.hello{font-size:28px;letter-spacing:-.8px;color:var(--ink);font-weight:500;margin:6px 0 4px}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.qa a{background:var(--glass-2);border:1px solid var(--line);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;transition:border-color .15s}
.qa a:hover{border-color:var(--blue)} .qa a b{color:var(--ink);font-weight:500} .qa a small{color:var(--muted);font-size:12.5px;line-height:1.35}
.qa .ico2{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.qa .ico2 svg{width:20px;height:20px}
.ratec{display:flex;justify-content:space-between;align-items:flex-end}
.ratec .v{font-family:'Geist Mono',monospace;font-size:30px;color:var(--ink);letter-spacing:-.5px}
.spark{width:100%;height:46px;margin-top:10px;color:var(--blue)}
.setup .stp{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2)}
.setup .stp:last-child{border-bottom:0}
.setup .stp b{color:var(--ink);font-weight:500;display:block;font-size:14.5px} .setup .stp small{color:var(--muted);font-size:12.5px}
.setup .stp .go{margin-left:auto}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none;color:var(--muted)}
.ck.done{background:var(--ok);border-color:var(--ok);color:#000}
.pbar{height:6px;border-radius:6px;background:var(--line-2);overflow:hidden;margin:10px 0 4px} .pbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.legal{margin-top:28px;padding-top:16px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted);line-height:1.6}
.legal b{color:var(--text);font-weight:500}
.legal a{color:var(--text);text-decoration:underline;text-underline-offset:2px}

/* ================= composer ================= */
.box{border:1px solid var(--line);background:var(--field);border-radius:16px;padding:14px 16px}
.box label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.amtline{display:flex;align-items:center;gap:10px}
.amtline input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-family:'Geist Mono',monospace;font-size:32px;padding:0;outline:none}
.amtline input::placeholder{color:var(--muted)} .amtline input:disabled{opacity:.5}
.box:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.cur{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font-weight:500;cursor:pointer;flex:none}
.cur i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:700}
.cur .usdt{background:#26A17B;color:#fff}.cur .lkr{background:#8D153A;color:#FFBE29}
.out{font-family:'Geist Mono',monospace;font-size:26px;color:var(--ink)}
.swap{display:flex;justify-content:center;margin:-14px 0;position:relative;z-index:2}
.swap button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);cursor:pointer}
.qchips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.qc{border:1px solid var(--line);background:var(--glass-2);border-radius:99px;padding:5px 12px;font-family:'Geist Mono',monospace;font-size:13px;cursor:pointer;color:var(--text)}
.qc:hover,.qc.on{border-color:var(--blue);color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--glass-2);margin-top:8px;cursor:pointer;width:100%;text-align:left}
.row:hover{border-color:var(--blue)} .row .k{font-size:12px;color:var(--muted);min-width:34px}
.row b{display:block;color:var(--ink);font-weight:500} .row small{color:var(--muted)} .row .chev{margin-left:auto;color:var(--muted)}
.row.need{border-style:dashed}
.av{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.people{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.pp{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;background:none;border:0;cursor:pointer;color:var(--text);font-size:12px}
.pp .av{width:48px;height:48px;font-size:15px;border:2px solid transparent}
.pp.on .av{border-color:var(--blue)} .pp.on span:last-child{color:var(--ink)} .pp.add .av{background:var(--glass);color:var(--ink);border:1px dashed var(--line)}
.pp span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rate{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.rate .mono{color:var(--text)}
.stepn{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
.risk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line-2);background:var(--glass-2);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.5}
.risk b{color:var(--text);font-weight:500}
.risk .ri{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--warn);color:var(--warn);display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.risk a{color:var(--blue)}

/* ================= forms ================= */
.fld{margin-top:14px} .fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.fld .ferr{color:var(--err);font-size:12.5px;margin-top:5px;min-height:0}
.fld.bad .f{border-color:var(--err)}
.f[readonly]{opacity:.75}
select.f{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{font-family:'Geist Mono',monospace}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;margin-top:14px;color:var(--text);cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--blue);width:17px;height:17px;flex:none}

/* ================= lists / status ================= */
.tx{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line-2);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.tx:last-child{border-bottom:0} .tx:hover{background:var(--glass-2)}
.tx b{color:var(--ink);font-weight:500;display:block} .tx small{color:var(--muted)} .tx .r{margin-left:auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.st-completed{background:var(--okS);color:var(--ok)} .st-charging,.st-converting,.st-paying_out{background:var(--blue-soft);color:var(--blue)}
.st-rate_changed,.st-refund_requested{background:var(--warnS);color:var(--warn)} .st-charge_failed,.st-payout_failed{background:var(--errS);color:var(--err)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)} .empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}
.filters{display:flex;gap:6px;margin-bottom:10px}
.filters button{border:1px solid var(--line);background:var(--glass-2);border-radius:99px;padding:6px 12px;font-size:13px;color:var(--text);cursor:pointer}
.filters button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hero-st{text-align:center;padding:10px 0 4px}
.hero-st .amtbig{margin:4px 0}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:99px}
.lim{margin-top:10px} .lim .t{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)} .lim .t b{color:var(--ink);font-weight:500}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px} .kv:last-child{border-bottom:0} .kv b{color:var(--ink);font-weight:500;text-align:right}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* ================= info pages ================= */
.trust{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media (max-width:560px){.trust{grid-template-columns:1fr}}
.trust .card b{display:block;color:var(--ink);font-weight:500;margin:10px 0 6px} .trust .card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
.trust svg{width:22px;height:22px;color:var(--blue)}
table.fees{width:100%;border-collapse:collapse;font-size:14px} table.fees td,table.fees th{padding:12px 6px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
table.fees tr:last-child td{border-bottom:0}
table.fees th{color:var(--muted);font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-family:'Geist Mono',monospace}
table.fees td:last-child,table.fees th:last-child{text-align:right} table.fees td b{color:var(--ink);font-weight:500}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1} @media (max-width:820px){.toast{bottom:96px}}
@media (max-width:520px){.amtline input{font-size:28px}.out{font-size:22px}.hello{font-size:24px}.qa a{padding:14px 10px}.panel{padding:16px;border-radius:20px}}
</style>

<script>
/* =====================================================================
   CeyPay standalone demo. Hash-routed views; the in-browser mock stands in
   for the CeyPay backend (Direct Debit + Offramp). Replace the functions in
   the "mock backend" block with API calls to go live.
   ===================================================================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-LK',{minimumFractionDigits:d,maximumFractionDigits:d});
const lkr=n=>'LKR '+fmt(n);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{return JSON.parse(localStorage.getItem('cpapp_'+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem('cpapp_'+k,JSON.stringify(v))}catch(e){}}};
const PNAME={binance:'Binance',bybit:'Bybit',kucoin:'KuCoin'};
const xl=(p,big)=>`<i class="xl ${p}"${big?' style="width:40px;height:40px;border-radius:12px;font-size:17px"':''}>${(PNAME[p]||'?')[0]}</i>`;
const initials=n=>String(n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const uid=p=>p+Math.random().toString(16).slice(2,12).toUpperCase();
const mask=a=>'•••'+String(a).slice(-4);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
const I={
  sell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12l16-8-6 16-2-7z"/></svg>',
  buy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20V8M6 14l6-6 6 6M5 4h14"/></svg>'};

/* ================= config ================= */
const CFG={fee_pct:1.5,min_usdt:5,daily_limit_usdt:2000,tol_pct:0.5,base_rate:300,
  company:'CeylonCash PVT LTD',reg_no:'[PV 000000]',reg_status:'[to be confirmed under Sri Lanka’s VASP framework]',support:'support@ceypay.io',
  relationships:['Family','Spouse','Parent','Child','Sibling','Friend','Employee','Business','Other'],
  purposes:['Family support','Education','Medical','Savings','Salary','Business payment','Gift','Other']};
const BANKS=[{code:7010,name:'Bank of Ceylon'},{code:7056,name:'Commercial Bank PLC'},{code:7083,name:'Hatton National Bank PLC'},{code:7135,name:"People's Bank"},{code:7278,name:'Sampath Bank PLC'},{code:7287,name:'Seylan Bank PLC'},{code:7162,name:'Nations Trust Bank PLC'},{code:7454,name:'DFCC Bank PLC'},{code:7214,name:'National Development Bank PLC'},{code:7719,name:'National Savings Bank'},{code:7311,name:'Pan Asia Banking Corporation PLC'},{code:7302,name:'Union Bank of Colombo PLC'}].sort((a,b)=>a.name.localeCompare(b.name));

/* ================= mock backend ================= */
const DB={user:store.get('user',null),profile:store.get('profile',null),kyc:store.get('kyc','not_started'),accounts:store.get('accounts',[]),payees:store.get('payees',[]),tx:store.get('tx',[]),waitlist:store.get('waitlist',null)};
const save=()=>['user','profile','kyc','accounts','payees','tx','waitlist'].forEach(k=>store.set(k,DB[k]));
const rateAt=t=>Math.round(CFG.base_rate*(1+((Math.floor(t/30000)%7)-3)/1000)*100)/100;
const rate=()=>rateAt(Date.now());
function quote(usdt,lkrWant){const r=rate(),keep=1-CFG.fee_pct/100;const gross=lkrWant?Math.ceil(lkrWant/r/keep*100)/100:Math.round(usdt*100)/100;const net=gross*keep;
  return{gross_usdt:gross,fees_usdt:Math.round((gross-net)*100)/100,net_usdt:net,rate:r,lkr_out:Math.floor(net*r*100)/100,at:Date.now()}}
const monthSpent=a=>DB.tx.filter(t=>t.account_id===a.id&&!/charge_failed/.test(t.state)&&t.created>Date.now()-30*864e5).reduce((s,t)=>s+t.gross_usdt,0);
const daySpent=()=>DB.tx.filter(t=>!/charge_failed/.test(t.state)&&t.created>Date.now()-864e5).reduce((s,t)=>s+t.gross_usdt,0);
function createTransfer({payee,account,q,purpose}){
  if(DB.kyc!=='verified')return{error:'Verify your identity first'};
  if(q.gross_usdt<CFG.min_usdt)return{error:`The minimum is ${CFG.min_usdt} USDT`};
  if(daySpent()+q.gross_usdt>CFG.daily_limit_usdt)return{error:`This would exceed your daily limit of ${CFG.daily_limit_usdt} USDT`};
  if(q.gross_usdt>account.per_txn_limit)return{error:`This is above the ${account.per_txn_limit} USDT per-transfer limit on ${PNAME[account.provider]} · ${account.label}`};
  if(monthSpent(account)+q.gross_usdt>account.monthly_limit)return{error:'This would exceed the monthly limit on this exchange account'};
  const fresh=quote(q.gross_usdt);if(fresh.lkr_out<q.lkr_out*(1-CFG.tol_pct/100))return{error:'The rate just moved. Please review the new amount.',requote:true};
  const t={id:(payee.is_self?'SL-':'RM-')+uid(''),kind:payee.is_self?'sell':'remit',state:'charging',created:Date.now(),gross_usdt:q.gross_usdt,fees_usdt:q.fees_usdt,
    quoted_lkr:q.lkr_out,quote_rate:q.rate,purpose,account_id:account.id,account_label:`${PNAME[account.provider]} · ${account.label}`,
    payee:{name:payee.account_name,nickname:payee.nickname,bank:payee.bank_name,account:mask(payee.account_number),self:payee.is_self,relationship:payee.relationship},
    _fail:payee.account_number.endsWith('0000'),_t0:Date.now()};
  DB.tx.unshift(t);save();return{tx:t};
}
function advance(t,act){ // charge → PAID → quote on NET → offramp → CEFT
  if(act==='refund'&&t.state==='rate_changed'){t.state='refund_requested';t.message='Refund requested. Support will return your USDT to the exchange account.';save();return t}
  const dt=Date.now()-t._t0;
  if(t.state==='charging'&&dt>1100)t.state='converting';
  if(t.state==='converting'||(t.state==='rate_changed'&&act==='accept')){const q=quote(t.gross_usdt);
    if(t._forceDrop&&act!=='accept'){q.lkr_out=Math.floor(t.quoted_lkr*0.97*100)/100;q.rate=Math.round(t.quote_rate*.97*100)/100;delete t._forceDrop}
    if(q.lkr_out<t.quoted_lkr*(1-CFG.tol_pct/100)&&act!=='accept'){t.state='rate_changed';t.new_lkr=q.lkr_out;t.new_rate=q.rate}
    else{t.state='paying_out';t.rate=t.new_rate||q.rate;t.lkr_out=t.new_lkr||q.lkr_out;t._p0=Date.now()}}
  if(t.state==='paying_out'&&Date.now()-t._p0>2000){if(t._fail){t.state='payout_failed';t.message='The recipient bank rejected the transfer: account closed or invalid.'}else{t.state='completed';t.completed=Date.now();t.bank_ref='CEFT'+Math.floor(1e9+Math.random()*9e9)}}
  save();return t;
}

const ORDER=['charging','converting','paying_out','completed'];
function timeline(t){const i=ORDER.indexOf(t.state),fi={charge_failed:0,rate_changed:1,refund_requested:1,payout_failed:2}[t.state]??-1;
  const N=[[`USDT collected`,`${fmt(t.gross_usdt)} USDT from ${esc(t.account_label)}`],[`Converted to rupees`,t.rate?`At LKR ${fmt(t.rate)} per USDT`:'At the protected rate'],[`Sent by CEFT`,`To ${esc(t.payee.bank)} ${esc(t.payee.account)}`],[`Delivered`,t.bank_ref?`Bank ref ${esc(t.bank_ref)}`:'Usually within minutes']];

    <p class="fine" style="font-size:14px;margin:8px 0 0">We’ll open buying only after it is authorised under Sri Lanka’s virtual asset service provider framework, and after it is aligned with Central Bank rules on converting rupees. Until then, you can sell USDT you already hold or send rupees home.</p></div>
    <div class="kv" style="margin-top:10px"><span>Pay with</span><b>Your own bank account only</b></div>
    <div class="kv"><span>Receive in</span><b>Your own verified exchange account</b></div>
    <div class="kv"><span>Checks</span><b>Same identity checks and limits as selling</b></div>
  </div>
  <div class="ptitle">Get notified</div>
  <div class="panel">${w?`<div style="color:var(--ok)">✓ You’re on the list (${esc(w.email)}). We’ll let you know when buying opens.</div><button class="btn ghost sm" id="wlx" style="margin-top:10px">Remove me</button>`:`
    <div class="two"><div class="fld" style="margin-top:0"><label for="we">Email</label><input class="f" id="we" type="email" value="${esc(DB.user?.email||'')}"><div class="ferr"></div></div><div class="fld" style="margin-top:0"><label for="wm">Mobile (optional)</label><input class="f cd" id="wm" inputmode="tel" placeholder="07X XXX XXXX"><div class="ferr"></div></div></div>
    <label class="chk"><input type="checkbox" id="wc">I agree to be contacted about the launch of buying on CeyPay.</label>
    <button class="btn lg" id="wgo" style="margin-top:14px" disabled>Notify me</button>`}</div>
  <div class="panel" style="margin-top:12px"><a class="kv" href="#/sell"><span>Sell USDT you already hold</span><b>›</b></a><a class="kv" href="#/send"><span>Send rupees to family</span><b>›</b></a></div></div>`};
ROUTES.buy.after=()=>{if($('wc')){$('wc').onchange=()=>$('wgo').disabled=!$('wc').checked;
  $('wgo').onclick=()=>{const e=$('we').value.trim(),m=$('wm').value.replace(/\s/g,'');let ok=true;ok&=field('we',/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)?'':'Enter a valid email');ok&=field('wm',!m||/^(\+94|0)7\d{8}$/.test(m)?'':'Mobile should look like 07X XXX XXXX');if(!ok)return;
    DB.waitlist={email:e,mobile:m,at:Date.now()};save();toast('You’re on the list');render()}}
  if($('wlx'))$('wlx').onclick=()=>{DB.waitlist=null;save();render()}};

/* ================= INFO ================= */
ROUTES.info=([page])=>{
  if(page==='fees')return `<div class="col">${vh('Fees and limits','Demo values. The live values will be published here.')}
    <div class="panel" style="padding:6px 16px"><table class="fees">
    <tr><th>Item</th><th>Sell &amp; send</th></tr>
    <tr><td>Exchange and CeyPay Direct Debit fee</td><td><b>~${CFG.fee_pct}%</b> of USDT</td></tr>
    <tr><td>Bank payout (CEFT)</td><td><b>Free</b></td></tr>
    <tr><td>Minimum per transfer</td><td><b>${CFG.min_usdt} USDT</b></td></tr>
    <tr><td>Maximum per transfer</td><td>Your exchange contract limit</td></tr>
    <tr><td>Daily limit per user</td><td><b>${CFG.daily_limit_usdt.toLocaleString()} USDT</b></td></tr>
    <tr><td>Rate protection</td><td>We ask you first if the rate moves more than <b>${CFG.tol_pct}%</b></td></tr></table></div>${legal()}</div>`;
  if(page==='faq')return `<div class="col faq">${vh('Help and complaints','')}
    <div class="panel" style="padding:4px 18px">
    <details><summary>Is this legal in Sri Lanka?</summary><p>Sri Lanka is putting a framework for virtual asset service providers in place. CeyPay works with regulators, runs identity, AML and record-keeping controls, and pays out only to Sri Lankan bank accounts. Buying is held back until it is authorised.</p></details>
    <details><summary>How fast does the money arrive?</summary><p>Usually within minutes. CEFT settles in real time for most member banks, and some banks take longer outside banking hours.</p></details>
    <details><summary>What if the rate changes after I pay?</summary><p>If it moves more than ${CFG.tol_pct}% before we send the rupees, we pause and ask you. You can accept the new amount or cancel and request a refund.</p></details>
    <details><summary>Why do you ask for a purpose when I send money?</summary><p>Every remittance needs a recorded purpose and relationship to the recipient. This protects you and your family, and it is part of our anti-money-laundering obligations.</p></details>
    <details><summary>How do I make a complaint?</summary><p>Email ${esc(CFG.support)} with your CeyPay reference. We acknowledge within 1 working day and aim to resolve within 7 working days. You can escalate to the relevant authority if you’re not satisfied.</p></details>
    </div>${legal()}</div>`;
  return `<div class="col">${vh('How we keep this safe','Every transfer is identified, screened, capped and recorded')}
    <div class="trust">
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 10h4M14 14h3"/></svg><b>Verified identity</b><p>Every user verifies once with a NIC or passport and a liveness check before their first transfer.</p></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg><b>Screened every time</b><p>Users and recipients are checked against sanctions and watch lists. Unusual activity is reviewed and reported where the law requires.</p></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><b>Limits you can see</b><p>Per-transfer, daily and monthly caps are shown before you confirm, and are enforced on our side.</p></div>
    <div class="card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></svg><b>Full records</b><p>Each transfer keeps the sender, the recipient, the purpose, the rate and the bank reference, for audits and dispute handling.</p></div>
    </div>
    <div class="card" style="margin-top:12px"><b style="color:var(--ink);font-weight:500">Closed loop: exchange to bank, never to wallets</b><p class="fine" style="font-size:14px;margin:6px 0 0">USDT comes from your own verified Binance, Bybit or KuCoin account through a CeyPay Direct Debit contract you sign. Rupees go only to Sri Lankan bank accounts through CEFT. CeyPay never sends crypto to external wallet addresses.</p></div>
    ${legal()}</div>`};

/* ================= boot ================= */
document.querySelectorAll('.lg svg').forEach(s=>{s.removeAttribute('width');s.removeAttribute('height')});
render();
</script>
</body>
</html>
