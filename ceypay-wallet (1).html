<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CeyPay</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* CeyPay design tokens: from ceypay.io (Geist, #1C6EF5, glass cards r24, buttons r8) */
:root{
  --blue:#1C6EF5; --blue-2:#3d86ff; --blue-soft:rgba(28,110,245,.14);
  --bg:#000; --bg-2:#0a0a0a; --glass:rgba(255,255,255,.05); --glass-2:rgba(255,255,255,.035); --line:rgba(255,255,255,.15); --line-2:rgba(255,255,255,.1);
  --ink:#fff; --text:#d4d4d8; --muted:#a1a1aa; --field:rgba(255,255,255,.06);
  --ok:#34d399; --okS:rgba(52,211,153,.12); --err:#f87171; --errS:rgba(248,113,113,.12); --warn:#fbbf24; --warnS:rgba(251,191,36,.12);
  --h-grad:linear-gradient(#fff,#fff,rgba(255,255,255,.6)); --h2-grad:linear-gradient(to right,#fff 0%,rgba(255,255,255,.3) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.35),transparent 70%);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#fff; --bg-2:#f6f7f9; --glass:#f7f8fa; --glass-2:#fafbfc; --line:#e4e4e7; --line-2:#ececef; --ink:#09090b; --text:#3f3f46; --muted:#71717a; --field:#fff;
  --ok:#059669; --okS:#ecfdf5; --err:#dc2626; --errS:#fef2f2; --warn:#b45309; --warnS:#fffbeb;
  --h-grad:linear-gradient(#09090b,#09090b,rgba(9,9,11,.65)); --h2-grad:linear-gradient(to right,#09090b 0%,rgba(9,9,11,.45) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.16),transparent 70%);
}}
:root[data-theme="light"]{
  --bg:#fff; --bg-2:#f6f7f9; --glass:#f7f8fa; --glass-2:#fafbfc; --line:#e4e4e7; --line-2:#ececef; --ink:#09090b; --text:#3f3f46; --muted:#71717a; --field:#fff;
  --ok:#059669; --okS:#ecfdf5; --err:#dc2626; --errS:#fef2f2; --warn:#b45309; --warnS:#fffbeb;
  --h-grad:linear-gradient(#09090b,#09090b,rgba(9,9,11,.65)); --h2-grad:linear-gradient(to right,#09090b 0%,rgba(9,9,11,.45) 100%);
  --glow:radial-gradient(60% 50% at 50% 0%,rgba(28,110,245,.16),transparent 70%);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Geist,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.hidden{display:none!important}
.sandbar{font-family:'Geist Mono',monospace;font-size:11.5px;text-align:center;padding:6px 16px;background:var(--warnS);color:var(--warn);letter-spacing:.3px}

/* nav: floating glass bar */
.navw{position:sticky;top:10px;z-index:30;padding:0 12px}
nav{max-width:1120px;margin:10px auto 0;display:flex;align-items:center;gap:22px;padding:8px 8px 8px 16px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;color:var(--ink)} .logo img,.logo svg{height:26px;width:auto;display:block}
.links{display:flex;gap:22px;font-size:14px;color:var(--text)} .links a:hover{color:var(--ink)}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-2)} .btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--glass);border:1px solid var(--line);color:var(--ink)} .btn.ghost:hover{background:var(--line-2)}
.btn.lg{height:52px;font-size:16px;border-radius:12px;width:100%}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
#userBtn{display:flex;align-items:center}
@media (max-width:860px){.links{display:none}}
@media (max-width:520px){.big{font-size:19px;padding-right:128px}.det{max-width:118px}.chips{grid-template-columns:repeat(3,1fr)}}

/* hero */
.hero{position:relative;padding:64px 0 40px;text-align:center;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:var(--glow);pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:4px 12px 4px 4px;font-size:12.5px;color:var(--text)}
.pill b{background:var(--blue);color:#fff;border-radius:99px;padding:2px 9px;font-weight:500;font-size:11.5px}
h1{font-weight:500;font-size:clamp(34px,6vw,60px);line-height:1.05;letter-spacing:-1.8px;margin:18px 0 12px;color:var(--ink)}
h1 span{display:block;background:var(--h-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span+span{opacity:.75}
.lead{max-width:560px;margin:0 auto;color:var(--muted);font-size:16.5px;line-height:1.55}

/* composer */
.composer{position:relative;max-width:640px;margin:28px auto 0;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;backdrop-filter:blur(8px)}
.recents{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.recents::-webkit-scrollbar{display:none}
.rc{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass-2);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.rc:hover{border-color:var(--blue)} .rc i{font-style:normal;color:var(--muted)}
.inrow{position:relative}
.big{width:100%;height:64px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:22px;letter-spacing:.5px;padding:0 150px 0 18px;font-family:'Geist Mono',monospace}
.big::placeholder{font-family:Geist,sans-serif;letter-spacing:0;font-size:17px;color:var(--muted)}
.big:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.det{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer;max-width:140px}
.det span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det .dotc{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.det.none{color:var(--muted)} .det.none .dotc{background:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;min-height:18px}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:14px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 14px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.chip{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2);font-weight:500;cursor:pointer;font-family:'Geist Mono',monospace;font-size:14px}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--ink)}
.amtrow{display:flex;gap:10px;align-items:center;margin-top:12px}
.amt{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-family:'Geist Mono',monospace;font-size:18px;padding:0 14px 0 56px}
.amt:focus{outline:none;border-color:var(--blue)}
.amtw{position:relative;flex:1} .amtw::before{content:"LKR";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;font-family:'Geist Mono',monospace}
.duebox{margin-top:14px;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;background:var(--glass-2);display:flex;justify-content:space-between;gap:12px;align-items:center}
.duebox small{color:var(--muted);display:block} .duebox b{color:var(--ink);font-weight:500}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line-2),var(--line),var(--line-2));background-size:200% 100%;animation:sk 1.2s infinite;width:140px}
@keyframes sk{to{background-position:-200% 0}}
.payrow{margin-top:16px}
.payvia{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.payvia a{color:var(--blue);cursor:pointer}
.err{margin-top:10px;border-radius:10px;padding:9px 12px;font-size:13.5px;background:var(--errS);color:var(--err)}

/* sections */
section.s{padding:72px 0}
h2{font-weight:400;font-size:clamp(26px,3.6vw,36px);letter-spacing:-1.8px;margin:0 0 8px;background:var(--h2-grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.15}
.sub{color:var(--muted);margin:0 0 28px;font-size:16px;max-width:620px;line-height:1.5}
.grid{display:grid;gap:12px}
.cats{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.card{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:20px}
.card.c2{background:var(--glass-2);border-color:var(--line-2)}
.cat{cursor:pointer;text-align:left;transition:border-color .15s} .cat:hover{border-color:var(--blue)}
.cat svg{width:26px;height:26px;color:var(--blue);margin-bottom:14px}
.cat b{display:block;color:var(--ink);font-weight:500} .cat small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
.bento{grid-template-columns:repeat(3,1fr)} @media (max-width:820px){.bento{grid-template-columns:1fr}}
.bento .card b{display:block;color:var(--ink);font-weight:500;font-size:17px;margin-bottom:6px}
.bento .card p{margin:0;color:var(--muted);line-height:1.55}
.span2{grid-column:span 2} @media (max-width:820px){.span2{grid-column:auto}}
.xrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.xb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:500;color:var(--ink);background:var(--glass-2)}
.xl{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#000;flex:none}
.xl.binance{background:#F0B90B}.xl.bybit{background:#F7A600}.xl.kucoin{background:#23AF91}
.steps3{grid-template-columns:repeat(3,1fr)} @media (max-width:760px){.steps3{grid-template-columns:1fr}}
.n{font-family:'Geist Mono',monospace;color:var(--blue);font-size:13px;margin-bottom:10px}
.faq details{border-bottom:1px solid var(--line-2);padding:16px 0}
.faq summary{cursor:pointer;color:var(--ink);font-weight:500;font-size:16px;list-style:none;display:flex;justify-content:space-between}
.faq summary::after{content:"+";color:var(--muted)} .faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);line-height:1.6;margin:10px 0 0}
footer{border-top:1px solid var(--line-2);padding:40px 0 30px;font-size:13.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:24px} @media (max-width:760px){.fgrid{grid-template-columns:1fr 1fr}}
footer h4{color:var(--ink);font-weight:500;margin:0 0 10px;font-size:14px} footer a{display:block;margin:7px 0} footer a:hover{color:var(--ink)}

/* sheet */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:48px 14px}
.ov.on{display:flex}
.sheet{width:100%;max-width:480px;background:var(--bg-2);border:1px solid var(--line);border-radius:24px;padding:22px;position:relative;color:var(--text)}
@media (max-width:520px){.ov{padding:0;align-items:flex-end}.sheet{border-radius:24px 24px 0 0;max-height:92vh;overflow:auto}}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
.sh{color:var(--ink);font-size:19px;font-weight:500;margin:0 40px 4px 0;letter-spacing:-.4px}
.shs{color:var(--muted);font-size:13.5px;margin:0 0 16px;line-height:1.5}
label.l{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
.f{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:15px;padding:0 12px}
.f:focus{outline:none;border-color:var(--blue)}
.opt{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--glass-2);cursor:pointer;margin-top:8px;width:100%;text-align:left}
.opt:hover{border-color:var(--blue)} .opt.on{border-color:var(--blue);background:var(--blue-soft)} .opt.dis{opacity:.5;cursor:not-allowed}
.opt b{display:block;color:var(--ink);font-weight:500} .opt small{color:var(--muted)} .opt .r{margin-left:auto;text-align:right;font-size:13px;white-space:nowrap}
.ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:600;font-size:12px;flex:none}
.grp{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:18px 0 2px;font-family:'Geist Mono',monospace}
.sum{border:1px solid var(--line-2);border-radius:14px;padding:10px 14px;margin-top:12px;background:var(--glass-2)}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px} .sum b{color:var(--ink);font-weight:500;text-align:right}
.sum .tot{border-top:1px solid var(--line-2);margin-top:6px;padding-top:10px;font-size:16px}
.stat{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;font-family:'Geist Mono',monospace}
.st-active{background:var(--okS);color:var(--ok)} .st-pending_authorization{background:var(--warnS);color:var(--warn)} .st-rejected_duplicate,.st-expired{background:var(--errS);color:var(--err)}
.bar{height:5px;border-radius:5px;background:var(--line-2);margin-top:8px;overflow:hidden} .bar i{display:block;height:100%;background:var(--blue)}
.acc{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--glass-2);margin-top:10px}
.acc .top{display:flex;align-items:center;gap:10px} .acc .top b{color:var(--ink);font-weight:500}
.acc .meta{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.acc .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.xpick{border:1px solid var(--line);border-radius:14px;padding:14px 8px;background:var(--glass-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-weight:500}
.xpick.on{border-color:var(--blue);background:var(--blue-soft)} .xpick .xl{width:30px;height:30px;font-size:13px;border-radius:8px}
.prog{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.pst{display:flex;gap:10px;align-items:center;color:var(--ink)}
.dt{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;flex:none}
.dt.done{background:var(--ok);border-color:var(--ok);color:#000} .dt.run{border-color:var(--blue);border-top-color:transparent;animation:spin 1s linear infinite} .dt.fail{background:var(--err);border-color:var(--err);color:#000}
@keyframes spin{to{transform:rotate(360deg)}}
.tick{width:64px;height:64px;border-radius:50%;background:var(--okS);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:8px auto}
.amtbig{text-align:center;font-size:36px;color:var(--ink);font-weight:500;letter-spacing:-1px;font-family:'Geist Mono',monospace}
.qr{background:#fff;padding:12px;border-radius:12px;width:max-content;margin:12px auto}
.search{position:relative;margin-bottom:6px}
.list{max-height:56vh;overflow:auto}

/* ============ shell ============ */
body{min-height:100vh;background:var(--bg)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 14px;border-right:1px solid var(--line-2);background:var(--bg-2)}
.side .lg{padding:0 10px 22px;display:flex;align-items:center;gap:10px}
.side .lg svg{height:26px;width:auto;color:var(--ink)}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--text);font-size:15px;position:relative}
.nv svg{width:20px;height:20px;flex:none}
.nv:hover{background:var(--glass-2);color:var(--ink)}
.nv[aria-current="page"]{background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nv .dot{position:absolute;right:12px;width:7px;height:7px;border-radius:50%;background:var(--err)}
.sgrp{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-family:'Geist Mono',monospace;padding:18px 12px 6px}
.soon{font-family:'Geist Mono',monospace;font-size:9.5px;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:99px;background:var(--warnS);color:var(--warn)}
.side .sp{flex:1}
.meb{display:flex;align-items:center;gap:12px;padding:14px 10px 4px;border-top:1px solid var(--line-2);margin-top:10px;border-radius:0;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;cursor:pointer;width:100%}
.meb b{display:block;color:var(--ink);font-weight:500;font-size:14.5px} .meb small{color:var(--muted);font-size:12.5px;display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avt{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.demo{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.5px;padding:3px 7px;border-radius:99px;background:var(--warnS);color:var(--warn)}
main{min-width:0}
.phead{height:76px;display:flex;align-items:center;gap:12px;padding:0 28px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);z-index:6}
.phead h1{font-size:24px;letter-spacing:-.5px;margin:0;font-weight:500;color:var(--ink)}
.phead .sp{flex:1}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink);display:grid;place-items:center;cursor:pointer}
.ib:hover{background:var(--glass);border-color:var(--line)} .ib svg{width:20px;height:20px}
.back{display:none}
.pad{padding:24px 28px 60px}
.col{max-width:560px}
.fine{font-size:12.5px;color:var(--muted);line-height:1.5}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ============ master / detail ============ */
.md{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:calc(100vh - 76px)}
.md .list{padding:4px 12px 40px;min-width:0}
.lgrp{padding:18px 16px 6px;font-size:13px;color:var(--muted)}
.lrow{display:grid;grid-template-columns:34px minmax(0,1.5fr) minmax(0,1.1fr) 118px 170px;gap:14px;align-items:center;padding:11px 16px;border-radius:12px;cursor:pointer;width:100%;text-align:left;background:none;border:0;color:var(--text);font-size:15px}
.lrow+.lrow{box-shadow:0 -1px 0 var(--line-2)} .lrow.sel+.lrow,.lrow:hover+.lrow{box-shadow:none}
.lrow:hover{background:var(--glass-2)} .lrow.sel{background:var(--glass);box-shadow:inset 0 0 0 1px var(--line)!important}
.lrow .nm{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .c2,.lrow .c3{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lamt{text-align:right;color:var(--ink);font-family:'Geist Mono',monospace;font-size:14.5px;white-space:nowrap}
.lrow .lsub{display:none}
.lrow.w3{grid-template-columns:34px minmax(0,1fr) auto}
.lrow.r4{grid-template-columns:34px minmax(0,1.5fr) 140px 160px}
.detail{border-left:1px solid var(--line-2);padding:34px 28px 40px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}
.dempty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:14px}
.dhead{text-align:center}

<script>
/* =====================================================================
   CeyPay: standalone demo (no backend). Hash router; the in-browser store
   stands in for Clerk (auth), Pay&Go (cards, bills), LankaClear JustPay

function nextRun(x){const d=new Date();const n=new Date(d.getFullYear(),d.getMonth(),x.day||1);if(n<=d)n.setMonth(n.getMonth()+1);if(x.freq==='weekly'){const w=new Date(d);w.setDate(d.getDate()+((7+(x.day%7)-d.getDay())%7||7));return +w}return +n}

let ASEARCH='';

R.activity.after=([id])=>{const s=$('asq');s.oninput=()=>{ASEARCH=s.value;const p=s.selectionStart;render();const n=$('asq');n.focus();n.setSelectionRange(p,p)};
  const t=id&&DB.tx.find(x=>x.id===id);if(!t)return;
  if(LIVE(t.state))every(()=>{const p=t.state;advance(t);if(t.state!==p)render()},600);
  if($('rn'))$('rn').onclick=()=>{const n=prompt('Rename this',txTitle(t));if(n!==null){DB.names[t.cp.key]=n.trim()||undefined;if(!n.trim())delete DB.names[t.cp.key];save();render()}};
  if($('acc'))$('acc').onclick=()=>{advance(t,'accept');render()};if($('ref'))$('ref').onclick=()=>{advance(t,'refund');render()};
  if($('shr'))$('shr').onclick=()=>{const s=`CeyPay ${t.id}: ${lkr(t.lkr)} · ${txTitle(t)} · ${dLong(t.created)}${t.bank_ref?' · Bank ref '+t.bank_ref:''}${t.biller_ref?' · Ref '+t.biller_ref:''}`;navigator.share?navigator.share({text:s}).catch(()=>{}):navigator.clipboard?.writeText(s).then(()=>toast('Receipt copied'))}};
function timeline(t){const O=['charging','converting','paying_out','completed'];const i=O.indexOf(t.state),fi={charge_failed:0,rate_changed:1,refund_requested:1,payout_failed:2}[t.state]??-1;
  const N=[['USDT collected',`${fmt(t.usdt)} USDT from ${esc(mName(M(t.method_id)))}`],['Converted to rupees',t.rate?`At LKR ${fmt(t.rate)} per USDT`:'At the protected rate'],['Sent by CEFT',`To ${esc(t.payee?.bank)} ${esc(t.payee?.account)}`],['Delivered',t.bank_ref?`Bank ref ${esc(t.bank_ref)}`:'Usually within minutes']];
  return `<div class="prog" style="text-align:left">${N.map(([h,s],k)=>{let c='';if(fi===k)c='fail';else if(t.state==='completed'||k<(fi>=0?fi:i))c='done';else if(fi<0&&k===i)c='run';return `<div class="pst" style="align-items:flex-start"><span class="dt ${c}" style="margin-top:2px">${c==='done'?'✓':c==='fail'?'!':''}</span><div><div style="color:${c?'var(--ink)':'var(--muted)'}">${h}</div><div class="fine">${s}</div></div></div>`}).join('')}</div>`}
function txDetail(t){const m=M(t.method_id);const same=DB.tx.filter(x=>x.cp.key===t.cp.key).length;const fx=t.kind==='sell'||t.kind==='remit';

  ${fx&&t.state!=='completed'?`<div class="dcard" style="padding:6px 18px">${timeline(t)}</div>`:''}
  ${t.state==='rate_changed'?`<div class="alert warn"><span class="ai">!</span><div>The rate moved after you paid. ${t.kind==='sell'?'You’d':'They’d'} now receive <b>${lkr(t.new_lkr)}</b> instead of ${lkr(t.quoted_lkr)}. Nothing has been sent yet.</div></div><button class="btn lg" id="acc" style="margin-top:10px">Accept ${lkr(t.new_lkr)}</button><button class="btn ghost lg" id="ref" style="margin-top:8px">Cancel and request a refund</button>`:''}

    ${t.account?`<div class="drow"><span>${t.kind==='reload'?'Mobile':'Account'}</span><b class="mono">${esc(t.account)}</b></div>`:''}

    ${t.purpose&&t.kind==='remit'?`<div class="drow"><span>Purpose</span><b>${esc(t.payee?.relationship)} · ${esc(t.purpose)}</b></div>`:''}</div>

     :`<div class="drow"><span>Subtotal</span><b class="mono">${lkr(t.lkr)}</b></div><div class="drow"><span>Fee</span><b class="mono">${lkr(t.fee_lkr||0)}</b></div><div class="drow"><span>Total</span><b class="mono k">${lkr(t.lkr+(t.fee_lkr||0))}</b></div>`}
    ${t.bank_ref?`<div class="drow"><span>Bank ref</span><b class="mono">${esc(t.bank_ref)}</b></div>`:''}${t.biller_ref?`<div class="drow"><span>Biller ref</span><b class="mono">${esc(t.biller_ref)}</b></div>`:''}<div class="drow"><span>CeyPay ref</span><b class="mono">${esc(t.id)}</b></div></div>
  ${t.recurring_id&&DB.recurring.find(r=>r.id===t.recurring_id)?`<button class="dact" onclick="go('#/recurring/${t.recurring_id}')">${IC.recurring}Recurring payment<span class="r">${esc(DB.recurring.find(r=>r.id===t.recurring_id).plan)} ${IC.chev.replace('<svg','<svg style="width:16px;height:16px"')}</span></button>`:''}
  ${t.state==='completed'?`<button class="dact" id="shr">${IC.ext}${navigator.share?'Share receipt':'Copy receipt'}</button>`:''}
  <button class="dact" onclick="go('#/info/faq')">${IC.help}Help<span class="r">${IC.chev.replace('<svg','<svg style="width:16px;height:16px"')}</span></button>
  <button class="dact" onclick="ASEARCH='${esc(txTitle(t)).replace(/'/g,'')}';go('#/activity')">${IC.hist}History<span class="r">${same} transaction${same===1?'':'s'} ${IC.chev.replace('<svg','<svg style="width:16px;height:16px"')}</span></button>`}

R.recurring=([id],q)=>{if(id==='new')return R.recnew(q);const act=DB.recurring.filter(x=>x.status!=='canceled'),ina=DB.recurring.filter(x=>x.status==='canceled');const x=id&&DB.recurring.find(r=>r.id===id);

  <aside class="detail">${x?recDetail(x):'<div class="dempty">Select a recurring payment to see the details</div>'}</aside></div>`};
function recDetail(x){const m=M(x.method_id);const runs=DB.tx.filter(t=>t.recurring_id===x.id);const use=x.type==='remit'?'send':x.type;const opts=DB.methods.filter(pm=>USES[pm.type].includes(use));

  <div class="drow"><span>Details</span><b>${x.amount?lkr(x.amount)+(x.freq==='weekly'?' weekly':' monthly'):'Varies with usage'+(x.cap?` · up to ${lkr(x.cap)}`:'')}</b></div>

  :`<button class="dact" onclick="go('#/recurring/new?type=${x.type}')">${IC.plus}Set up again</button>`}
  <button class="dact" onclick="ASEARCH='${esc(x.name).replace(/'/g,'')}';go('#/activity')">${IC.hist}History<span class="r">${runs.length} payment${runs.length===1?'':'s'} ${IC.chev.replace('<svg','<svg style="width:16px;height:16px"')}</span></button>

const validExp=e=>{if(!/^\d{2}\/\d{2}$/.test(e))return false;const [mm,yy]=e.split('/').map(Number);return mm>=1&&mm<=12&&new Date(2000+yy,mm,1)>new Date()};
const luhn=n=>{let s=0,alt=false;for(let i=n.length-1;i>=0;i--){let d=+n[i];if(alt){d*=2;if(d>9)d-=9}s+=d;alt=!alt}return s%10===0};

R.account.after=()=>{document.querySelectorAll('[data-conn]').forEach(b=>b.onclick=()=>{DB.user.providers=[...(DB.user.providers||[]),b.dataset.conn];save();toast('Connected');render()});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!armed(b,'Confirm'))return;DB.payees=DB.payees.filter(p=>p.id!==b.dataset.del);save();render()});
  $('so').onclick=()=>{DB.user=null;save();AUTH={step:'start'};go('#/home')};$('rs').onclick=()=>{if(!armed($('rs'),'Tap again'))return;Object.keys(localStorage).filter(k=>k.startsWith('cpw_')).forEach(k=>localStorage.removeItem(k));location.hash='#/home';location.reload()}};
R.rates=()=>{const cur=Object.keys(FX.data).filter(k=>k!=='_meta'&&FX.data[k].buying_rate!==undefined);const f=(v,c)=>v?fmt(v,c==='JPY'||c==='INR'?4:2):'—';
  const body=`<div class="panel" style="padding:6px 16px;overflow-x:auto"><table class="fees"><tr><th>Currency</th><th>TT buying</th><th>Selling</th></tr>${cur.map(c=>`<tr><td><b style="font-family:'Geist Mono',monospace;color:var(--ink);font-weight:500">${c}</b><div class="fine">${esc(titleCase(FX.data[c].description))}</div></td><td class="mono">${f(FX.data[c].telegraphic_transfers_buying_rate||FX.data[c].buying_rate,c)}</td><td class="mono">${f(FX.data[c].selling_rate,c)}</td></tr>`).join('')}</table></div>
   <p class="fine" style="margin-top:12px">LKR per 1 unit. CeyPay uses <b style="color:var(--text)">USD TT buying</b> as its USDT reference, before fees. Source: <a href="${FX_BASE}" target="_blank" rel="noopener" style="color:var(--blue)">fx.ceyloncash.com</a> · as of ${fxDate()} ${fxBadge()}</p>`;
  return DB.user?`${phead('Exchange rates','','#/home')}<div class="pad"><div class="col">${body}</div></div>`:`<div class="auth" style="place-items:start center"><div class="authc" style="max-width:640px"><a href="#/signin" class="btn ghost sm" style="margin-bottom:14px">← Sign in</a><h1 style="color:var(--ink);font-weight:500;margin:0 0 12px">Exchange rates</h1>${body}</div></div>`};
R.info=([page])=>{const back=DB.user?'#/account':'#/signin';let b='';
  if(page==='fees')b=`<div class="panel" style="padding:6px 16px"><table class="fees"><tr><th>Item</th><th>Fee / limit</th></tr><tr><td>Sell &amp; send (exchange + CeyPay)</td><td>~${CFG.fee_pct}% of USDT</td></tr><tr><td>Bills &amp; reloads (card or JustPay)</td><td>Free</td></tr><tr><td>Bank payout (CEFT)</td><td>Free</td></tr><tr><td>Minimum transfer</td><td>${CFG.min_usdt} USDT</td></tr><tr><td>Daily limit</td><td>${CFG.daily_limit_usdt.toLocaleString()} USDT</td></tr><tr><td>Reference rate</td><td>CeylonCash FX · USD TT buying</td></tr><tr><td>Rate protection</td><td>Asks you if it moves more than ${CFG.tol_pct}%</td></tr></table></div>`;
  else if(page==='faq')b=`<div class="panel faq" style="padding:4px 18px"><details><summary>Which payment methods can I use?</summary><p>Exchange accounts (Binance, Bybit, KuCoin) for selling, sending and paying in USDT. Cards and JustPay bank accounts for bills and reloads in rupees. Cards can’t be used for digital assets.</p></details><details><summary>What is JustPay?</summary><p>LankaClear’s account-to-account service. You approve CeyPay once in your bank app, then confirm each payment within your limit.</p></details><details><summary>How do recurring payments work?</summary><p>Set a bill autopay, a mobile reload, or a monthly transfer. You can change the payment method, pause or cancel at any time. For transfers, you confirm the rate each time.</p></details><details><summary>How do I make a complaint?</summary><p>Email ${esc(CFG.support)} with your CeyPay reference. We acknowledge within 1 working day and aim to resolve within 7.</p></details></div>`;
  else b=`<div class="panel"><div class="kv"><span>Identity</span><b>NIC/passport + liveness, once</b></div><div class="kv"><span>Screening</span><b>Sanctions, PEP, adverse media</b></div><div class="kv"><span>Limits</span><b>Per transfer, daily, monthly</b></div><div class="kv"><span>Records</span><b>Sender, recipient, purpose, rate, bank ref</b></div><div class="kv"><span>Money flow</span><b>Exchange → CEFT bank account only</b></div><div class="kv"><span>Cards</span><b>Tokenised by Pay&amp;Go, never stored</b></div></div>`;
  const t={fees:'Fees and limits',faq:'Help and complaints'}[page]||'How we keep this safe';
  return DB.user?`${phead(t,'',back)}<div class="pad"><div class="col">${b}${legal()}</div></div>`:`<div class="auth" style="place-items:start center"><div class="authc" style="max-width:640px"><a href="#/signin" class="btn ghost sm" style="margin-bottom:14px">← Sign in</a><h1 style="color:var(--ink);font-weight:500;margin:0 0 12px">${t}</h1>${b}${legal()}</div></div>`};

document.addEventListener('input',e=>{const f=e.target.closest?.('.fld');if(f&&f.classList.contains('bad')){f.classList.remove('bad');const x=f.querySelector('.ferr');if(x)x.textContent=''}});
render();loadFx();
</script>
</body>
