<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CeyFi · Offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #000; color: #d4d4d8;
    font: 15px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { color: #fff; font-size: 20px; font-weight: 600; margin: 20px 0 6px; }
  p { margin: 0 0 24px; color: #a1a1aa; }
  button { background: #1c6ef5; color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { background: #3d86ff; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>CeyFi needs a connection to show live rates and payments.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
